<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="对话">
<meta name="theme-color" content="#f4efe6">
<title>Mandarin Dialogues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6; --card:#fffdf8; --ink:#1f1b16; --muted:#857a6b; --line:#e4dccd;
  --red:#c2392b; --red-soft:#f6dcd6; --jade:#2f7d63; --jade-soft:#d7ece3; --gold:#c9932e;
  --them:#ffffff; --me:#1f1b16; --meText:#fffdf8;
  --zh:"Noto Serif SC","PingFang SC","Hiragino Sans GB","Songti SC",serif;
  --ui:"Inter",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);height:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--zh);font-weight:700;font-size:20px;letter-spacing:.04em}
.brand small{font-family:var(--ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:6px}
.streak{margin-left:auto;display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px}
.streak svg{width:18px;height:18px}
.goal{margin-top:10px}
.goalbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.goalfill{height:100%;width:0;background:linear-gradient(90deg,var(--red),#e0644f);border-radius:99px;transition:width .4s}
.goal.done .goalfill{background:linear-gradient(90deg,var(--jade),#46a383)}
.goallbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.banner{margin:10px 18px 0;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.4;background:#fff3d6;border:1px solid #ecd49a}
.banner.err{background:var(--red-soft);border-color:#e7b2a8}

/* tabs */
.tabs{display:flex;gap:6px;padding:12px 18px 0}
.tab{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--paper)}

/* home */
.home{padding:14px 18px 40px}
.cat{margin-bottom:22px}
.cathead{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.cathead h2{margin:0;font-size:18px}
.cathead .zh{font-family:var(--zh);color:var(--red);font-size:16px}
.dlg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.dlg .ic{width:42px;height:42px;border-radius:12px;background:var(--paper);display:grid;place-items:center;flex:none}
.dlg .ic svg{width:28px;height:28px}
.dlg .t{font-weight:600;font-size:15px}
.dlg .s{font-family:var(--zh);color:var(--muted);font-size:14px;margin-top:2px}
.dlg .meta{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-left:3px}
.dot.on{background:var(--jade)}

/* dialogue screen */
.dhead{display:flex;align-items:center;gap:10px;padding:10px 14px}
.back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.dtitle{font-weight:700;font-size:16px;line-height:1.2}
.dtitle .zh{font-family:var(--zh);color:var(--red);font-weight:700;margin-left:6px}
.ver{margin-left:auto;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.modes{display:flex;margin:0 14px;background:var(--line);border-radius:12px;padding:3px}
.mode{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.mode.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.feed{flex:1;padding:16px 12px 200px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;line-height:1.5}
.who{font-size:11px;color:var(--muted);margin:0 6px 3px;font-weight:600;letter-spacing:.02em}
.row{display:flex;flex-direction:column;align-items:flex-start;max-width:92%;animation:pop .25s ease-out}
.row.me{align-self:flex-end;align-items:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.bub{background:var(--them);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 12px 10px;min-width:220px}
.me .bub{background:var(--me);color:var(--meText);border-color:var(--me);border-radius:18px 18px 6px 18px}
.voice{display:flex;align-items:center;gap:10px}
.pbtn{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--red);color:#fff}
.me .pbtn{background:var(--paper);color:var(--ink)}
.pbtn svg{width:14px;height:14px}
.wave{position:relative;flex:1;height:30px}
.bars{position:absolute;inset:0;display:flex;align-items:center;gap:2px}
.bars i{flex:1;border-radius:2px;background:#d8cfbf;min-height:3px}
.me .bars i{background:#5b5248}
.bars.fill{clip-path:inset(0 100% 0 0)}
.bars.fill i{background:var(--red)}
.me .bars.fill i{background:var(--gold)}
.dur{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:30px;text-align:right}
.me .dur{color:#a99e8e}
.txt{margin-top:8px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 1px;line-height:1}
.txt.hidden{display:none}
.w{display:inline-flex;flex-direction:column;align-items:center;padding:3px 2px;border-radius:6px}
.w .py{font-size:11px;color:var(--muted);margin-bottom:3px;white-space:nowrap;font-family:var(--ui)}
.me .w .py{color:#b5aa99}
.w .hz{font-family:var(--zh);font-size:21px;font-weight:500;letter-spacing:.02em}
.w.tap:active,.w.sel{background:var(--red-soft)}
.me .w.tap:active,.me .w.sel{background:#3a332b}
.pu{font-family:var(--zh);font-size:21px;padding-bottom:3px}
.hz .ok{color:var(--jade)} .hz .bad{color:var(--red);text-decoration:underline wavy}
.src{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);padding:1px 4px;border-radius:4px}

/* speak card */
.speak{align-self:stretch;max-width:100%;background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:14px;animation:pop .25s}
.speak .lbl{font-size:12px;font-weight:700;color:var(--red);letter-spacing:.04em;margin-bottom:8px}
.speak .heard{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.speak .heard b{font-family:var(--zh);color:var(--ink);font-weight:500;font-size:16px}
.speak .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;background:var(--paper);border:1px solid var(--line)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.mic{background:var(--red);color:#fff;border-color:var(--red);display:flex;align-items:center;gap:8px}
.btn.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,57,43,.45)}100%{box-shadow:0 0 0 14px rgba(194,57,43,0)}}
.score{font-weight:700;font-size:13px;margin-top:8px}
.score.good{color:var(--jade)} .score.meh{color:var(--red)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.dockin{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.side{width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.side button{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink)}
.side svg{width:20px;height:20px}
.big{width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(194,57,43,.35)}
.big svg{width:30px;height:30px}
.big.mic{background:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* popover */
.pop{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:120px;width:min(92vw,420px);background:var(--ink);color:var(--paper);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:pop .18s}
.pop .pic{width:58px;height:58px;flex:none;background:var(--paper);border-radius:14px;display:grid;place-items:center}
.pop .pic svg{width:44px;height:44px}
.pop .hz{font-family:var(--zh);font-size:26px;font-weight:700}
.pop .py{color:#d8c9b0;font-size:14px;margin-left:8px}
.pop .g{margin-top:4px;font-size:15px}
.pop .say{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#3a332b;display:grid;place-items:center;flex:none}
.pop .say svg{width:18px;height:18px}

/* words */
.words{padding:14px 18px 40px}
.wseg{display:flex;gap:6px;margin-bottom:14px}
.wseg button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--card)}
.wseg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:340px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.card .pic svg{width:72px;height:72px}
.card .big-hz{font-family:var(--zh);font-size:54px;font-weight:700;line-height:1.1}
.card .cpy{font-size:20px;color:var(--red);font-weight:600}
.card .cg{font-size:18px}
.card .ex{margin-top:12px;padding-top:14px;border-top:1px solid var(--line);width:100%}
.card .ex .txt{justify-content:center}
.card .exen{font-size:13px;color:var(--muted);margin-top:8px}
.card .hint{font-size:12px;color:var(--muted)}
.wacts{display:flex;gap:10px;margin-top:14px}
.wacts .btn{flex:1;padding:14px}
.wstat{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:10px 18px 30px;line-height:1.5}
</style>
</head>

/* ---------- storage (visible failures) ---------- */
const GOAL_MS = 30*60*1000;
const KEY = 'zh-dialogues-v1';
let storageOK = true, storageErr = '';
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s) return s; }
  catch(e){ storageOK=false; storageErr = String(e && e.message || e); }
  return {days:{}, ver:{}, done:{}, cards:{}};
}
let ST = loadState();
ST.days ||= {}; ST.ver ||= {}; ST.done ||= {}; ST.cards ||= {};
let saveTimer=null, dbRef=null, dbDoc=null;
function save(now){
  clearTimeout(saveTimer);
  const go=()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(ST)); storageOK=true; }
    catch(e){ storageOK=false; storageErr=String(e && e.message || e); renderBanner(); }
    if(dbDoc){ dbDoc.set({state: JSON.stringify(ST), at: Date.now()}).catch(e=>{ dbErr = 'Cloud save failed: '+(e && (e.code||e.message)||e); renderBanner(); }); }
  };
  if(now) go(); else saveTimer=setTimeout(go, 1500);
}
let dbErr='';
// Optional cloud sync when hosted on claude.ai (merges by max per day)
(async()=>{
  try{
    if(!window.claude || !claude.use) return;
    const db = await claude.use('db'); const user = await claude.use('user');
    if(!db || !user) return;
    const id = await user.id();
    dbDoc = db.collection('data/users/'+id).doc('progress');
    const snap = await dbDoc.get();
    const remote = snap && (snap.data ? snap.data() : snap);
    if(remote && remote.state){
      const r = JSON.parse(remote.state);
      for(const [d,ms] of Object.entries(r.days||{})) ST.days[d] = Math.max(ST.days[d]||0, ms);
      Object.assign(ST.done, r.done||{}); ST.ver = {...(r.ver||{}), ...ST.ver}; ST.cards = {...(r.cards||{}), ...ST.cards};
      save(true); render();
    } else save(true);
  }catch(e){ dbErr = 'Cloud sync unavailable: '+(e && (e.code||e.message)||e); renderBanner(); }
})();

const dayKey = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function todayMs(){ return ST.days[dayKey()]||0; }
function streak(){
  let n=0; const d=new Date();
  if((ST.days[dayKey(d)]||0) >= GOAL_MS) n=1;
  d.setDate(d.getDate()-1);
  while((ST.days[dayKey(d)]||0) >= GOAL_MS){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function addTime(ms){
  if(ms<=0||ms>5000) return;
  const k=dayKey(); const before = ST.days[k]||0; ST.days[k]=before+ms; save();
  updateGoal(before < GOAL_MS && ST.days[k] >= GOAL_MS);
}

/* ---------- active-time clock: counts only while audio plays or mic listens ---------- */
let active = 0, lastTick = performance.now();
setInterval(()=>{ const n=performance.now(); if(active>0) addTime(n-lastTick); lastTick=n; }, 250);
const busy = { on(){ active++; }, off(){ active=Math.max(0,active-1); } };

/* ---------- audio: recorded mp3 first, phone voice as fallback ---------- */
const audioCache = {};   // id -> {ok:bool, url, peaks, dur}
// audio/manifest.json lists which recorded clips exist (written by the audio script)
let AUDIO_SET = null;
const manifestReady = fetch('audio/manifest.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).then(a=>{ AUDIO_SET=new Set(a); }).catch(()=>{ AUDIO_SET=new Set(); });
let RATE = 1;
function hashPeaks(id, n=34){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; const a=[]; for(let i=0;i<n;i++){ h=(h*1103515245+12345)>>>0; const env=Math.sin(Math.PI*(i+.5)/n)**.6; a.push(.25+.75*env*((h>>>8)%1000)/1000); } return a; }
async function probe(line){
  if(audioCache[line.id]) return audioCache[line.id];
  const url = 'audio/'+line.id+'.mp3';
  const rec = {ok:false, url, peaks: hashPeaks(line.id), dur: estDur(line.t)};
  audioCache[line.id]=rec;
  await manifestReady;
  if(!AUDIO_SET.has(line.id)) return rec;
  try{
    const r = await fetch(url, {cache:'force-cache'});
    if(!r.ok) showToast('Recorded clip missing on server: '+line.id+' — using phone voice.');
    if(r.ok){
      const buf = await r.arrayBuffer();
      rec.ok = true; rec.blob = URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));
      try{
        const AC = window.AudioContext||window.webkitAudioContext; const ac = new AC();
        const ab = await new Promise((res,rej)=>ac.decodeAudioData(buf.slice(0),res,rej));
        rec.dur = ab.duration; const ch = ab.getChannelData(0); const n=34, step=Math.floor(ch.length/n); const p=[];
        for(let i=0;i<n;i++){ let m=0; for(let j=i*step;j<(i+1)*step;j+=16){ const v=Math.abs(ch[j]); if(v>m) m=v; } p.push(m); }
        const mx=Math.max(...p)||1; rec.peaks=p.map(v=>.15+.85*v/mx); ac.close&&ac.close();
      }catch(e){}
    }
  }catch(e){}
  return rec;
}
function estDur(t){ const n=[...t].filter(c=>/[一-鿿]/.test(c)).length; return .6 + n*.26; }

let zhVoices = [];
function loadVoices(){ try{ zhVoices = speechSynthesis.getVoices().filter(v=>/^zh[-_](CN|Hans)/i.test(v.lang) || v.lang==='zh'); }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(kind){
  if(!zhVoices.length) return null;
  const male = zhVoices.find(v=>/li-?mu|yu-?shu|male|男|kangkang|yunxi|yunyang/i.test(v.name) && !/female/i.test(v.name));
  const fem  = zhVoices.find(v=>/ting-?ting|female|女|xiaoxiao|huihui|yaoyao|meijia|shanshan/i.test(v.name)) || zhVoices[0];
  return kind==='f' ? fem : (male || zhVoices[zhVoices.length>1?1:0]);
}

let current = null; // {stop()}
function stopAudio(){ if(current){ current.stop(); current=null; } }
// plays one line; onProg(0..1); resolves true when finished, false when stopped
function playLine(line, onProg){
  stopAudio();
  return new Promise(async resolve=>{
    const rec = await probe(line);
    let done=false, raf=0;
    const finish=(ok)=>{ if(done) return; done=true; cancelAnimationFrame(raf); busy.off(); onProg && onProg(ok?1:null); resolve(ok); };
    busy.on();
    if(rec.ok){
      const a = new Audio(rec.blob); a.playbackRate = RATE; a.preservesPitch = true;
      const tick=()=>{ if(a.duration) onProg && onProg(a.currentTime/a.duration); raf=requestAnimationFrame(tick); };
      a.onended=()=>finish(true); a.onerror=()=>{ showToast('Audio file failed to play: '+line.id); finish(false); };
      current={stop(){ a.pause(); finish(false); }};
      a.play().then(tick).catch(e=>{ showToast('Playback blocked: '+(e.message||e)); finish(false); });
    } else {
      if(!('speechSynthesis' in window)){ showToast('No audio file and no speech voice on this device.'); finish(false); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(line.t);
      u.lang='zh-CN'; const v=pickVoice(line.v==='me'?'m':line.v); if(v) u.voice=v;
      u.rate = .92*RATE; if(!v || (line.v!=='f' && v===pickVoice('f'))) u.pitch = line.v==='f'?1.15:.85;
      const est = rec.dur/RATE*1000, t0=performance.now();
      const tick=()=>{ onProg && onProg(Math.min(.97,(performance.now()-t0)/est)); raf=requestAnimationFrame(tick); };
      u.onend=()=>finish(true); u.onerror=(e)=>{ if(e.error!=='interrupted' && e.error!=='canceled') showToast('Speech voice error: '+e.error); finish(false); };
      current={stop(){ speechSynthesis.cancel(); finish(false); }};
      speechSynthesis.speak(u); tick();
    }
  });
}
function speakWord(text){ playLine({id:'w_'+text, t:text, v:'f'}, null); }

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let dictation = null; // claude.ai capability (Chromium only)
(async()=>{ try{ if(window.claude && claude.use){ dictation = await claude.use('dictation'); if(dictation) render(); } }catch(e){} })();
function micAvailable(){ return !!SR || !!dictation; }
function listen(onPartial){
  return new Promise((resolve,reject)=>{
    let text='';
    if(SR){
      const r = new SR(); r.lang='zh-CN'; r.interimResults=true; r.continuous=false; r.maxAlternatives=3;
      busy.on(); let ended=false;
      const end=()=>{ if(ended) return; ended=true; busy.off(); };
      r.onresult=(e)=>{ let s=''; for(const res of e.results) s+=res[0].transcript; text=s; onPartial(s); };
      r.onerror=(e)=>{ end(); reject(new Error(e.error==='not-allowed'?'Microphone or speech recognition not allowed. On iPhone: Settings → Safari → Microphone, and Siri & Dictation must be on.':
        e.error==='no-speech'?'Didn\'t hear anything — try again a bit louder.':'Recognition error: '+e.error)); };
      r.onend=()=>{ end(); resolve(text); };
      listen.stop=()=>{ try{ r.stop(); }catch(e){} };
      try{ r.start(); }catch(e){ end(); reject(e); }
    } else if(dictation){
      busy.on(); let ended=false; const end=()=>{ if(!ended){ ended=true; busy.off(); } };
      dictation.onPartial(({text:t})=>onPartial(text+t));
      dictation.onFinal(({text:t})=>{ text+=t; onPartial(text); });
      dictation.onState(({state})=>{ if(state==='idle'){ end(); resolve(text); } });
      listen.stop=()=>dictation.stop().catch(()=>{});
      dictation.start().catch(e=>{ end(); reject(new Error(e && e.code==='not_granted'?'Dictation not allowed.':'Dictation failed: '+(e && (e.code||e.message)||e))); });
    } else reject(new Error('No speech recognition here.'));
  });
}
const CN_DIG='零一二三四五六七八九';
function numToCn(n){
  n=parseInt(n,10); if(isNaN(n)) return '';
  if(n<10) return CN_DIG[n];
  if(n<20) return '十'+(n%10?CN_DIG[n%10]:'');
  if(n<100) return CN_DIG[Math.floor(n/10)]+'十'+(n%10?CN_DIG[n%10]:'');
  if(n<1000){ const h=Math.floor(n/100), r=n%100; return CN_DIG[h]+'百'+(r===0?'':(r<10?'零'+CN_DIG[r]:(r<20?'一十'+(r%10?CN_DIG[r%10]:''):numToCn(r)))); }
  return String(n).split('').map(d=>CN_DIG[+d]).join('');
}
function norm(s){
  return s.replace(/\d+(\.\d+)?/g,m=>{ if(m.includes('.')){ const [a,b]=m.split('.'); return numToCn(a)+'块'+numToCn(b); } return numToCn(m); })
          .replace(/[^一-鿿A-Za-z0-9]/g,'').replace(/两/g,'二').replace(/幺/g,'一');
}
function digitsAlt(s){ return s.replace(/\d/g,d=>CN_DIG[+d]); }
// LCS alignment → which target chars were matched
function grade(target, heard){
  const best = [norm(heard), digitsAlt(heard).replace(/[^一-鿿A-Za-z]/g,'').replace(/两/g,'二')]
    .map(h=>align(target, h)).sort((a,b)=>b.score-a.score)[0];
  return best;
}
function align(target, h){
  const T=[...target]; const idx=[]; const tc=[];
  T.forEach((c,i)=>{ if(/[一-鿿A-Za-z0-9]/.test(c)){ idx.push(i); tc.push(c==='两'?'二':c); } });
  const H=[...h]; const n=tc.length, m=H.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]= tc[i]===H[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Set(); let i=0,j=0; while(i<n&&j<m){ if(tc[i]===H[j]){ ok.add(idx[i]); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return {ok, score: n? ok.size/n : 0};
}

function updateGoal(justDone){

  document.getElementById('goalnum').textContent=fmtMin(Math.min(ms,GOAL_MS*9))+' / 30:00';
  document.getElementById('goal').classList.toggle('done', ms>=GOAL_MS);
  if(ms>=GOAL_MS) document.getElementById('goaltxt').textContent='Goal reached today';
  document.getElementById('streakN').textContent=streak();
  if(justDone){ save(true); showToast('30 minutes done — streak: '+streak()+' 🔥'); document.getElementById('toast').className='banner'; }
}
function renderBanner(){
  const slot=document.getElementById('bannerSlot'); if(!slot) return;
  const msgs=[];
  if(!storageOK) msgs.push(`<div class="banner err"><b>Progress is NOT being saved</b> on this device (${esc(storageErr)}). Your streak will reset when you close the page.</div>`);
  if(dbErr) msgs.push(`<div class="banner err">${esc(dbErr)}</div>`);
  slot.innerHTML=msgs.join('');
}

function render(){
  if(VIEW.name==='dialogue') return renderDialogue();
  $app.innerHTML = topHTML() + `<div class="tabs"><button class="tab ${VIEW.tab==='dialogues'?'on':''}" data-tab="dialogues">Dialogues</button><button class="tab ${VIEW.tab==='words'?'on':''}" data-tab="words">Flashcards</button></div>`
    + (VIEW.tab==='dialogues' ? homeHTML() : wordsHTML());
  renderBanner();
  $app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ VIEW.tab=b.dataset.tab; render(); });
  $app.querySelectorAll('[data-dlg]').forEach(b=>b.onclick=()=>openDialogue(b.dataset.cat, b.dataset.dlg));
  if(VIEW.tab==='words') bindWords();
}
function homeHTML(){
  return `<div class="home">`+DATA.categories.map(c=>`<div class="cat"><div class="cathead"><h2>${esc(c.title)}</h2><span class="zh">${c.zh}</span></div>`+
    c.dialogues.map(d=>{ const key=c.id+'/'+d.id; const dots=d.versions.map((_,i)=>`<span class="dot ${ST.done[key+'#'+i]?'on':''}"></span>`).join('');
      return `<button class="dlg" data-cat="${c.id}" data-dlg="${d.id}"><span class="ic">${ICONS[CAT_ICON[d.id]]||''}</span><span><div class="t">${esc(d.title)}</div><div class="s">${d.zh}</div></span><span class="meta">${d.versions.length} versions<br>${dots}</span></button>`;}).join('')+`</div>`).join('')
    + `</div><div class="foot">Tap any word for its meaning. Versions rotate each time you open a dialogue.</div>`;
}

/* ---------- dialogue ---------- */
let D=null; // session
function openDialogue(catId, dlgId){
  const cat=DATA.categories.find(c=>c.id===catId), dlg=cat.dialogues.find(d=>d.id===dlgId), key=catId+'/'+dlgId;
  const last = ST.ver[key]; const vi = (last===undefined ? 0 : (last+1) % dlg.versions.length);
  ST.ver[key]=vi; save();
  D={cat, dlg, key, vi, mode: D && D.mode || 'listen', shown:0, playing:false, runId:0, hideText: D && D.hideText || false};
  VIEW={name:'dialogue', tab:VIEW.tab}; renderDialogue();
  dlg.versions[vi].forEach(l=>probe(l));
}
function lines(){ return D.dlg.versions[D.vi]; }
function tokHTML(line, marks){
  return line.tok.map((t,i)=>{
    if(t.punct) return `<span class="pu">${esc(t.w)}</span>`;
    return `<span class="w tap" data-i="${i}"><span class="py">${esc(t.p)}</span><span class="hz">${esc(t.w)}</span></span>`;
  }).join('');
}
function bubbleHTML(line, n){
  const rec=audioCache[line.id]; const peaks=(rec&&rec.peaks)||hashPeaks(line.id); const bars=peaks.map(p=>`<i style="height:${Math.round(p*100)}%"></i>`).join('');
  const me=line.s==='B'; const who = me?'You':(D.dlg.zh.length? 'Them':'Them');
  return `<div class="row ${me?'me':''}" data-n="${n}"><div class="who">${me?'You':'Them'}</div><div class="bub">
    <div class="voice"><button class="pbtn" data-play="${n}">${UI.play}</button><div class="wave"><div class="bars">${bars}</div><div class="bars fill">${bars}</div></div>
    <span class="dur">${(rec?rec.dur:estDur(line.t)).toFixed(0)}s</span></div>
    <div class="txt ${D.hideText?'hidden':''}">${tokHTML(line)}</div>
    ${rec && !rec.ok ? '<div style="display:flex;margin-top:6px"><span class="src" title="No recorded audio yet — phone voice">PHONE VOICE</span></div>':''}</div></div>`;
}
function renderDialogue(){
  const L=lines();
  $app.innerHTML = topHTML() + `<div class="dhead"><button class="back" id="back">${UI.back}</button>
    <div class="dtitle">${esc(D.dlg.title)}<span class="zh">${D.dlg.zh}</span></div>
    <button class="ver" id="ver" title="Next version">v${D.vi+1}/${D.dlg.versions.length} ↻</button></div>
    <div class="modes"><button class="mode ${D.mode==='listen'?'on':''}" data-mode="listen">Listen</button><button class="mode ${D.mode==='talk'?'on':''}" data-mode="talk">Interactive</button></div>
    ${D.mode==='talk' && !micAvailable() ? `<div class="banner">Speech recognition isn't available in this view, so your lines can't be checked here. Say them out loud and tap <b>I said it</b>. Open the GitHub Pages version in Safari for checking.</div>`:''}
    <div class="feed" id="feed">${D.shown? L.slice(0,D.shown).map((l,i)=>bubbleHTML(l,i)).join('') : `<div class="empty">${D.mode==='listen'?'Press play — the conversation arrives as voice messages.':'You are the traveller. When it\'s your turn, read your line out loud.'}</div>`}</div>
    <div class="dock"><div class="dockin">
      <div class="side"><button id="spd">${RATE===1?'1×':RATE+'×'}</button>speed</div>
      <button class="big" id="big">${D.playing?UI.pause:UI.play}</button>
      <div class="side"><button id="hide">${D.hideText?UI.eyeoff:UI.eye}</button>${D.hideText?'text off':'text'}</div>
    </div></div>`;
  renderBanner();
  document.getElementById('back').onclick=()=>{ stopRun(); VIEW={name:'home',tab:VIEW.tab}; render(); };
  document.getElementById('ver').onclick=()=>{ stopRun(); openDialogue(D.cat.id, D.dlg.id); };
  $app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ stopRun(); D.mode=b.dataset.mode; D.shown=0; renderDialogue(); });
  document.getElementById('spd').onclick=()=>{ RATE = RATE===1?.8:RATE===.8?.65:1; renderDialogue(); };
  document.getElementById('hide').onclick=()=>{ D.hideText=!D.hideText; document.querySelectorAll('.feed .txt').forEach(t=>t.classList.toggle('hidden',D.hideText)); renderDialogue(); };
  document.getElementById('big').onclick=()=>{ if(D.playing) stopRun(); else run(); };
  bindFeed(document.getElementById('feed'));
}
function bindFeed(feed){
  feed.onclick=(e)=>{
    const pb=e.target.closest('[data-play]');
    if(pb){ stopRun(); const n=+pb.dataset.play; playBubble(n); return; }
    const w=e.target.closest('.w.tap');
    if(w){ const row=w.closest('[data-n]'); const line = row? lines()[+row.dataset.n] : (D.speakLine); showWord(line.tok[+w.dataset.i], w); }
  };
}
function rowEl(n){ return document.querySelector(`.row[data-n="${n}"]`); }
function setProg(n,p){ const r=rowEl(n); if(!r) return; const f=r.querySelector('.bars.fill'); if(p===null) p=0; f.style.clipPath=`inset(0 ${100-p*100}% 0 0)`; const b=r.querySelector('.pbtn'); b.innerHTML = (p>0&&p<1)?UI.pause:UI.play; }
async function playBubble(n){ const l=lines()[n]; const r=await playLine(l, p=>setProg(n,p)); }
function appendBubble(n){
  const feed=document.getElementById('feed'); const em=feed.querySelector('.empty'); if(em) em.remove();
  feed.insertAdjacentHTML('beforeend', bubbleHTML(lines()[n], n)); D.shown=Math.max(D.shown,n+1);
  rowEl(n).scrollIntoView({behavior:'smooth', block:'end'});
}
function setBig(){ const b=document.getElementById('big'); if(b) b.innerHTML=D.playing?UI.pause:UI.play; }
function stopRun(){ if(!D) return; D.runId++; D.playing=false; stopAudio(); if(listen.stop) listen.stop(); setBig(); }
async function run(){
  const L=lines(); const my=++D.runId; D.playing=true; setBig();
  if(D.shown>=L.length){ D.shown=0; document.getElementById('feed').innerHTML=''; }
  for(let n=D.shown; n<L.length; n++){
    if(my!==D.runId) return;
    const line=L[n];
    if(D.mode==='talk' && line.s==='B'){
      const ok = await speakTurn(line, n, my); if(!ok || my!==D.runId) return;
      continue;
    }
    appendBubble(n);
    await probe(line); if(my!==D.runId) return;
    const r=rowEl(n); if(r){ const rec=audioCache[line.id]; r.querySelector('.dur').textContent=rec.dur.toFixed(0)+'s'; }
    const fin = await playLine(line, p=>setProg(n,p));
    if(my!==D.runId) return;
    if(!fin){ stopRun(); return; }
    await new Promise(r=>setTimeout(r, 450));
  }
  if(my===D.runId){ D.playing=false; setBig(); ST.done[D.key+'#'+D.vi]=1; save(); }
}

/* interactive turn */
function speakTurn(line, n, my){
  return new Promise(resolve=>{
    const feed=document.getElementById('feed'); const em=feed.querySelector('.empty'); if(em) em.remove();
    D.speakLine=line;
    feed.insertAdjacentHTML('beforeend', `<div class="speak" id="spk"><div class="lbl">YOUR TURN — SAY IT</div>
      <div class="txt" id="spkTxt">${tokHTML(line)}</div><div class="heard" id="heard"></div><div id="scoreEl"></div>
      <div class="acts" id="acts"></div></div>`);
    const spk=document.getElementById('spk'); spk.scrollIntoView({behavior:'smooth',block:'end'});
    const acts=document.getElementById('acts');
    const send=()=>{ spk.remove(); appendBubble(n); D.speakLine=null;
      playLine(line, p=>setProg(n,p)).then(()=>setTimeout(()=>resolve(my===D.runId), 350)); };
    if(my!==D.runId){ resolve(false); return; }
    const hear=()=>{ playLine(line,null); };
    const paint=(res)=>{
      const tx=document.getElementById('spkTxt'); let ci=0;
      tx.querySelectorAll('.w').forEach((w,k)=>{ const t=line.tok[+w.dataset.i]; });
      // colour each character
      let pos=0; const chars=[...line.t];
      tx.querySelectorAll('.w .hz').forEach(hz=>{ const word=hz.textContent; let html='';
        for(const c of word){ while(pos<chars.length && chars[pos]!==c) pos++; html+=`<span class="${res.ok.has(pos)?'ok':'bad'}">${esc(c)}</span>`; pos++; }
        hz.innerHTML=html; });
    };
    const setActs=(state, res)=>{
      if(state==='idle') acts.innerHTML = micAvailable()
        ? `<button class="btn mic" id="mic">${UI.mic.replace('<svg','<svg width="18" height="18"')}Tap & speak</button><button class="btn" id="hearBtn">Hear it</button><button class="btn" id="skip">Skip</button>`
        : `<button class="btn pri" id="said">I said it ✓</button><button class="btn" id="hearBtn">Hear it</button>`;
      if(state==='live') acts.innerHTML = `<button class="btn mic live" id="stopMic">${UI.mic.replace('<svg','<svg width="18" height="18"')}Listening… tap to stop</button>`;
      if(state==='graded') acts.innerHTML = res.score>=.8
        ? `<button class="btn pri" id="sendBtn">Send ➤</button><button class="btn" id="mic">Again</button>`
        : `<button class="btn mic" id="mic">${UI.mic.replace('<svg','<svg width="18" height="18"')}Try again</button><button class="btn" id="hearBtn">Hear it</button><button class="btn" id="sendBtn">Send anyway</button>`;
      const g=id=>document.getElementById(id);
      g('mic') && (g('mic').onclick=startMic);
      g('stopMic') && (g('stopMic').onclick=()=>listen.stop && listen.stop());
      g('hearBtn') && (g('hearBtn').onclick=hear);
      g('skip') && (g('skip').onclick=send);
      g('sendBtn') && (g('sendBtn').onclick=send);
      g('said') && (g('said').onclick=()=>{ addTime(Math.min(8000, estDur(line.t)*1000)); send(); });
    };
    const startMic=()=>{
      stopAudio();
      const heard=document.getElementById('heard'); heard.innerHTML='Listening…'; document.getElementById('scoreEl').innerHTML='';
      setActs('live');
      listen(t=>{ heard.innerHTML='Heard: <b>'+esc(t)+'</b>'; })
        .then(t=>{
          if(!t){ heard.textContent='Nothing recognised — try again.'; setActs('idle'); return; }
          const res=grade(line.t, t); paint(res);
          const pct=Math.round(res.score*100);
          document.getElementById('scoreEl').innerHTML=`<div class="score ${res.score>=.8?'good':'meh'}">${pct}% match ${res.score>=.95?'— 很好！':res.score>=.8?'— good':'— red characters weren\'t recognised'}</div>`;
          setActs('graded', res);
          if(res.score>=.95) setTimeout(()=>{ if(document.getElementById('spk')) send(); }, 900);
        })
        .catch(e=>{ heard.textContent=''; showToast(e.message||String(e)); setActs('idle'); });
    };
    setActs('idle');
  });
}

/* word popover */
function wordIcon(w){ return ICONS[WORD_ICON[w]] || (()=>{ for(const k in WORD_ICON) if(w.includes(k) && k.length>1) return ICONS[WORD_ICON[k]]; return ''; })(); }
function showWord(t, el){
  document.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel')); el && el.classList.add('sel');
  let p=document.getElementById('pop'); if(p) p.remove();
  const ic=wordIcon(t.w);
  document.body.insertAdjacentHTML('beforeend', `<div class="pop" id="pop">${ic?`<div class="pic">${ic}</div>`:''}<div><div><span class="hz">${esc(t.w)}</span><span class="py">${esc(t.p)}</span></div><div class="g">${esc(t.g)}</div></div><button class="say" id="say">${UI.speaker}</button></div>`);
  document.getElementById('say').onclick=(e)=>{ e.stopPropagation(); speakWord(t.w); };
  setTimeout(()=>document.addEventListener('click', function off(ev){ if(!ev.target.closest('#pop') && !ev.target.closest('.w.tap')){ const q=document.getElementById('pop'); q&&q.remove(); document.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel')); document.removeEventListener('click',off);} }),0);
}

/* ---------- flashcards ---------- */
let WDECK='core', WI=0, WFLIP=false;
function dialogueVocab(){
  const seen=new Map();
  for(const c of DATA.categories) for(const d of c.dialogues) for(const v of d.versions) for(const l of v) for(const t of l.tok){
    if(t.punct || seen.has(t.w) || /^[A-Za-z0-9]+$/.test(t.w)) continue;
    if(/^[一二三四五六七八九十两百零]+(块|点|分钟|个|位|斤|楼|瓶|根)?$/.test(t.w)) continue;
    if(['的','了','吗','吧','呢','啊','哦','嗯','我','你','您','是','在','有','好','这','那','也','都','就','很'].includes(t.w)) continue;
    seen.set(t.w, {w:t.w, p:t.p, g:t.g, ex:l.tok, exT:l.t, exEn:''});
  }
  return [...seen.values()];
}
let VOCAB=null;
function deck(){ return WDECK==='core' ? DATA.core : (VOCAB ||= dialogueVocab()); }
function cardKey(c){ return WDECK+':'+c.w; }
function orderDeck(){ // Leitner-ish: lower box first, then not-yet-seen
  const d=deck().map((c,i)=>({c,i,b:(ST.cards[cardKey(c)]||{b:0}).b, t:(ST.cards[cardKey(c)]||{t:0}).t}));
  d.sort((a,b)=>a.b-b.b || a.t-b.t || a.i-b.i); return d.map(x=>x.c);
}
let ORDER=null;
function wordsHTML(){
  ORDER ||= orderDeck(); if(WI>=ORDER.length) WI=0;
  const c=ORDER[WI]; const ic=wordIcon(c.w); const known=Object.entries(ST.cards).filter(([k,v])=>k.startsWith(WDECK+':')&&v.b>=2).length;
  return `<div class="words"><div class="wseg"><button data-deck="core" class="${WDECK==='core'?'on':''}">Core words & patterns</button><button data-deck="dlg" class="${WDECK==='dlg'?'on':''}">From dialogues</button></div>
    <div class="card" id="card">${ic?`<div class="pic">${ic}</div>`:''}<div class="big-hz">${esc(c.w)}</div>
    ${WFLIP?`<div class="cpy">${esc(c.p)}</div><div class="cg">${esc(c.g)}</div><div class="ex"><div class="txt" id="extxt">${c.ex.map((t,i)=>t.punct?`<span class="pu">${esc(t.w)}</span>`:`<span class="w tap" data-i="${i}"><span class="py">${esc(t.p)}</span><span class="hz">${esc(t.w)}</span></span>`).join('')}</div>${c.exEn?`<div class="exen">${esc(c.exEn)}</div>`:''}</div>`
      :`<div class="hint">Tap to reveal</div>`}</div>
    <div class="wacts">${WFLIP?`<button class="btn" id="again">Again</button><button class="btn" id="hearEx">${'Hear'}</button><button class="btn pri" id="got">Got it</button>`:`<button class="btn" id="hearW">Hear</button><button class="btn pri" id="flip">Show</button>`}</div>
    <div class="wstat">${WI+1} / ${ORDER.length} · known: ${known}</div></div>`;
}
function bindWords(){
  const c=ORDER[WI];
  $app.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>{ WDECK=b.dataset.deck; ORDER=null; WI=0; WFLIP=false; render(); });
  const g=id=>document.getElementById(id);
  g('card').onclick=(e)=>{ const w=e.target.closest('.w.tap'); if(w){ showWord(c.ex[+w.dataset.i], w); return; } if(!WFLIP){ WFLIP=true; render(); } };
  g('flip') && (g('flip').onclick=()=>{ WFLIP=true; render(); });
  g('hearW') && (g('hearW').onclick=()=>speakWord(c.w.replace('…','')));
  g('hearEx') && (g('hearEx').onclick=()=>playLine({id:'ex_'+c.exT, t:c.exT, v:'f'}, null));
  const mark=(up)=>{ const k=cardKey(c); const s=ST.cards[k]||{b:0,t:0}; s.b = up? Math.min(5,s.b+1) : 0; s.t=Date.now(); ST.cards[k]=s; save(); WI++; WFLIP=false; if(WI>=ORDER.length){ ORDER=null; WI=0; } render(); };
  g('again') && (g('again').onclick=()=>mark(false));
  g('got') && (g('got').onclick=()=>mark(true));
}

window.addEventListener('pagehide', ()=>save(true));
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ save(true); } });
render();
</script>
